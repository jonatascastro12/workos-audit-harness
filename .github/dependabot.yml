version: 2
updates:
  # Root npm workspace (covers every package except packages/chat).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # packages/chat is deliberately not a workspace member and keeps its own
  # lockfile, so it needs its own entry.
  - package-ecosystem: npm
    directory: "/packages/chat"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
