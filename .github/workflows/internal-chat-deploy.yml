# WORKOS-INTERNAL INFRASTRUCTURE — NOT A SELF-HOSTING TEMPLATE.
#
# This deploys the live WorkOS audit-chat console. Every identifier below exists
# only in the WorkOS Cloudflare account and the WorkOS Doppler org: the
# `workos-tools-apps` dispatch namespace, the ROUTES KV namespace that fronts it,
# the `claude-day` Doppler project, and the `cd26-`-prefixed script and database
# names. A fork has none of them, so this workflow will fail on its first run and
# there is nothing to learn from the failure. It is kept here because it is how
# we ship, not as an example.
#
# Self-hosting your own console? Do NOT copy this file — see docs/deploy.md and
# packages/chat/README.md. Self-hosted deploys are a `wrangler deploy` against
# your own account with your own D1 ids; the dispatch-namespace indirection below
# is a WorkOS-specific ingress and is not something you need or want.
#
# packages/chat is deliberately NOT an npm workspace member: it keeps its own
# package-lock.json (vendored WorkOS design system + React Router toolchain),
# so every step runs with packages/chat as the working directory.
#
# Which wrangler config wins is decided at BUILD time, not deploy time, and that
# is easy to get backwards. The Cloudflare vite plugin resolves the config during
# `react-router build`, bakes it into build/server/wrangler.json, and writes
# .wrangler/deploy/config.json pointing at it; `wrangler deploy` then follows that
# redirect. So:
#
#   - the build MUST be `npm run build:internal` (it sets WRANGLER_CONFIG_PATH),
#     because a neutral build bakes the neutral config and no later flag undoes it
#   - the deploy MUST NOT pass `--config`. Doing so bypasses the redirect, and
#     wrangler then tries to bundle workers/app.ts directly and fails outright on
#     `Could not resolve "virtual:react-router/server-build"` — that module only
#     exists inside vite. Verified by dry run.
#
# D1 steps are different: they never go through the build, so they DO need an
# `*:internal` npm script (which passes --config) to reach the real database.
#
# Getting the build wrong is the dangerous half: a neutral build deploys a script
# named `workos-audit-chat` while the live `cd26-workos-audit-chat` freezes on its
# last good deploy, and the ROUTES KV key is rewritten to the new empty one.
# Green CI, dead console.
# The deployed identity is derived by `sed` from wrangler.internal.toml; if you
# ever need to change that, change it in all three places below at once.
name: internal chat deploy (WorkOS only)

on:
  push:
    branches:
      - main
    paths:
      - "packages/chat/**"
      - ".github/workflows/internal-chat-deploy.yml"
  pull_request:
    paths:
      - "packages/chat/**"
      - ".github/workflows/internal-chat-deploy.yml"
  workflow_dispatch:

# contents: write lets the deployment-URL commit comment post; everything else
# needs only the repo checkout.
permissions:
  contents: write

defaults:
  run:
    working-directory: packages/chat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/chat/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # Intentionally the NEUTRAL config: --local applies the migrations to a
      # throwaway miniflare sqlite, so this only asserts the SQL in migrations/
      # still applies cleanly. The database name it prints is irrelevant, and
      # using the neutral config means PRs from anywhere validate the same thing.
      - name: Validate migrations
        run: npm run db:migrate:local

      # build:internal, not build: this is what actually selects
      # wrangler.internal.toml for the deploy (see the header). A plain `npm run
      # build` here would silently ship the vendor-neutral config.
      - name: Build
        run: npm run build:internal
        env:
          NODE_ENV: production

      - name: Run database migrations
        if: github.ref == 'refs/heads/main'
        run: npm run db:migrate:internal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy INTO the dispatch namespace (no custom domain consumed). Reached via
      # the zone wildcard route -> workos-tools-dispatch -> ROUTES KV.
      #
      # Deliberately NO --config: the Build step already baked
      # wrangler.internal.toml into build/server/wrangler.json and wrangler follows
      # .wrangler/deploy/config.json to it. Passing --config here bypasses that
      # redirect and fails on `virtual:react-router/server-build`.
      #
      # Raw `npx wrangler` rather than `npm run deploy:internal` avoids a second
      # `react-router build` — the Build step above already produced ./build.
      - name: Deploy app (dispatch namespace)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy --dispatch-namespace workos-tools-apps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Secrets run AFTER deploy: a namespaced script must exist before secrets can
      # attach, and `wrangler secret bulk` has no --dispatch-namespace — so the
      # namespaced app's secrets go via the CF API (one PUT per secret). The
      # companion workflow worker is a normal Worker, so it keeps the bulk path.
      - name: Sync Doppler secrets to Cloudflare
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          curl -sLf https://cli.doppler.com/install.sh | sudo sh
          # Derive the deployed script name from the INTERNAL config, which is the
          # one the deploy step above uploaded (cd26-workos-audit-chat). Reading
          # wrangler.toml here would PUT ~120 secrets onto a script this workflow
          # never deploys and leave the live one with stale values.
          SCRIPT=$(sed -n 's/^name *= *"\(.*\)".*/\1/p' wrangler.internal.toml | head -1)

          # One compact JSON body per secret: jq escapes newlines, so multi-line
          # values (PEM keys, etc.) survive. A shell `read` on tab/newline would
          # split a multi-line value into bogus extra "secrets".
          #
          # Written to a file and looped WITHOUT a pipe: a `while` on the right of
          # a pipe runs in a subshell, so a failure flag set inside it would never
          # reach the check below.
          doppler secrets --json | jq -c 'to_entries[] | {name: .key, text: .value.computed, type: "secret_text"}' > /tmp/secrets.ndjson

          # Retry each PUT: with ~120 secrets this loop is brisk enough to draw a
          # transient 429/5xx, and one blip used to fail the whole deploy after
          # the app had already shipped. Real failures still fail the step.
          failed=0
          while IFS= read -r body; do
            name=$(printf '%s' "$body" | jq -r '.name')
            code=000
            for attempt in 1 2 3; do
              code=$(printf '%s' "$body" | curl -s -o /dev/null -w '%{http_code}' -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/dispatch/namespaces/workos-tools-apps/scripts/${SCRIPT}/secrets" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data @-) || code=000
              [ "$code" = "200" ] && break
              echo "secret $name attempt $attempt got HTTP $code; retrying"
              sleep $((attempt * 3))
            done
            if [ "$code" != "200" ]; then
              echo "::error::could not set secret $name (HTTP $code)"
              failed=1
            fi
          done < /tmp/secrets.ndjson
          rm -f /tmp/secrets.ndjson

          [ "$failed" = "0" ] || exit 1
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Idempotent: map this app's subdomain -> its namespaced script. Both are the
      # wrangler.internal.toml `name`, so derive it rather than hardcode — but derive
      # it from the SAME config the deploy used, or this rewrites the live route to
      # a script that was never deployed.
      # --remote is required — wrangler v4 `kv key put` defaults to LOCAL sim.
      - name: Register dispatch route in ROUTES KV
        if: github.ref == 'refs/heads/main'
        run: |
          SCRIPT=$(sed -n 's/^name *= *"\(.*\)".*/\1/p' wrangler.internal.toml | head -1)
          npx wrangler kv key put --remote --namespace-id 124917c1f819408193cd4e56b39543f3 "$SCRIPT" "$SCRIPT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment deployment URL
        if: github.ref == 'refs/heads/main'
        # Cosmetic — never fail a completed deploy over a comment.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'Deployed to Cloudflare Workers!\n\nhttps://cd26-workos-audit-chat.workos.tools'
            })
