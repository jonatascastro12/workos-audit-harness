# WORKOS-INTERNAL INFRASTRUCTURE — NOT A SELF-HOSTING TEMPLATE.
#
# This deploys the live WorkOS audit ingestion Worker (cd26-workos-audit-proxy in
# the workos-tools-apps dispatch namespace) from
# packages/proxy/wrangler.internal.toml. The dispatch namespace, the ROUTES KV
# namespace, the `claude-day` Doppler project and its AUDIT_HARNESS_* secret names
# all exist only inside WorkOS. A fork will fail on its first run.
#
# The package's vendor-neutral packages/proxy/wrangler.toml is deliberately
# untouched by this workflow — that is the one external adopters deploy. To
# self-host, see docs/deploy.md and packages/proxy/README.md; do not copy this
# file.
name: internal proxy deploy (WorkOS only)

on:
  push:
    branches:
      - main
    paths:
      - "packages/proxy/**"
      - ".github/workflows/internal-proxy-deploy.yml"
  workflow_dispatch:

# Least privilege: every step below authenticates to Cloudflare or Doppler with
# its own secret, so the workflow token only ever needs to read the checkout.
# Spelled out rather than inherited because on a public repo the org-wide default
# token permission is the difference between read-only and write.
permissions:
  contents: read

defaults:
  run:
    working-directory: packages/proxy

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Verify and deploy internal proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          # Resolved from the repo root, NOT from `defaults.run.working-directory`
          # (that only applies to `run` steps). This is the root workspace
          # lockfile, which is the right one — packages/proxy has no lockfile of
          # its own. Do not "correct" this to packages/proxy/package-lock.json.
          cache-dependency-path: package-lock.json

      # packages/proxy is a workspace member; install from the repo root.
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
        working-directory: .

      - name: Typecheck
        run: npm run verify

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cd26-workos-audit-proxy-db --remote --config wrangler.internal.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy (dispatch namespace)
        run: npx wrangler deploy --config wrangler.internal.toml --dispatch-namespace workos-tools-apps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The vendor-neutral code reads WORKOS_API_KEY / WORKOS_ORG_ID /
      # KANDJI_API_TOKEN; the shared claude-day Doppler project stores them
      # under AUDIT_HARNESS_* names — map explicitly rather than syncing the
      # whole config. Runs AFTER deploy (a namespaced script must exist first;
      # `wrangler secret bulk` has no --dispatch-namespace), and secrets persist
      # across script uploads, so the very first deploy of a new code version
      # already sees the values staged by the previous run.
      - name: Sync secrets (Doppler -> Cloudflare, name-mapped)
        run: |
          curl -sLf https://cli.doppler.com/install.sh | sudo sh
          sync_secret() {
            doppler secrets get "$2" --plain | python3 -c 'import json,sys; print(json.dumps({"name": sys.argv[1], "text": sys.stdin.read().rstrip("\n"), "type": "secret_text"}))' "$1" | \
            curl -sf -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/dispatch/namespaces/workos-tools-apps/scripts/cd26-workos-audit-proxy/secrets" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @- > /dev/null
          }
          sync_secret WORKOS_API_KEY AUDIT_HARNESS_WORKOS_API_KEY
          sync_secret WORKOS_ORG_ID AUDIT_HARNESS_WORKOS_ORG_ID
          sync_secret KANDJI_API_TOKEN AUDIT_HARNESS_KANDJI_API_TOKEN
          # Access application audience tag. Mode 1 (the only ingress that
          # works in the dispatch namespace) is refused without it, so this
          # must already exist in Doppler before the first deploy of the
          # signature-verifying code — see wrangler.internal.toml.
          sync_secret ACCESS_AUD AUDIT_HARNESS_ACCESS_AUD
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Idempotent: subdomain -> namespaced script for the dispatch router.
      - name: Register dispatch route in ROUTES KV
        run: npx wrangler kv key put --remote --namespace-id 124917c1f819408193cd4e56b39543f3 cd26-workos-audit-proxy cd26-workos-audit-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
