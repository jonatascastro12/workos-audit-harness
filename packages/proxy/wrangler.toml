# Vendor-neutral config: no account_id (wrangler uses your logged-in account)
# and no zone routes. After your first deploy, attach the Worker to a hostname
# on your own zone so you can put mTLS in front of it — see README.md.
# Keep this file vendor-neutral: WorkOS's own deploy lives in the private
# workos-audit-harness-deploy repo, which overlays a sibling internal config —
# if you ADD OR RENAME A BINDING OR VAR here, that internal config must be
# updated in the same change-set.
name = "workos-audit-proxy"
main = "src/index.ts"
compatibility_date = "2026-02-10"
# Disable the *.workers.dev route: it has no Access/WAF in front of it, so it
# would expose an unauthenticated ingress. Attach a custom hostname (see
# README) and put mTLS in front of it instead. Re-enable only for a throwaway
# smoke test, never for a real deployment.
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "workos-audit-proxy-db"
# Placeholder so local dev works out of the box. Before deploying, run
# `npm run db:create` and replace this with the database_id it prints.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# WorkOS organization the audit events are attributed to (org_...). Not a
# secret. The WORKOS_API_KEY secret is set separately: `wrangler secret put`.
WORKOS_ORG_ID = ""
# Uncomment to override the device-cert common-name pattern (one capture group
# for the device id). Default matches the Okta device-attestation cert.
# DEVICE_CERT_CN_PATTERN = "OktaManagementAttestation for ([^,\\s]+)"
# Required for the Cloudflare Access ingress (Option A). The Worker verifies the
# Cf-Access-Jwt-Assertion signature against this team's keys and checks its
# `aud` — set both or the header is ignored (mTLS Option B is used instead).
# ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# ACCESS_AUD = "your-access-application-aud-tag"
# Uncomment to resolve device→user live from Kandji/Iru (also requires the
# KANDJI_API_TOKEN secret). Without it, the D1 device_user table is the
# authoritative mapping — which is the supported path for every other MDM.
#
# Kandji is now named Iru; the KANDJI_ prefix is kept so existing deployments do
# not have to rotate a secret. This adapter is Kandji/Iru-shaped (it reads
# `body[0].user.email` from /api/v1/devices?serial_number=...), so pointing it at
# Jamf or Intune will NOT work — use the device_user table or add an adapter in
# src/device.ts. See README.md.
# KANDJI_API_BASE = "https://yourtenant.api.kandji.io"

[observability]
enabled = true
