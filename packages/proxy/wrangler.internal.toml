# WorkOS-internal deployment of this vendor-neutral proxy: the Worker behind
# https://cd26-workos-audit-proxy.workos.tools that ingests the WorkOS agent
# fleet's audit events. Deploys into the workos-tools-apps dispatch namespace
# (zone wildcard route -> workos-tools-dispatch -> ROUTES KV), so identity
# arrives via Cf-Access-Jwt-Assertion (mode 1 in src/device.ts).
#
# Deploy: npm run deploy:internal (or CI .github/workflows/proxy-deploy.yml).
# Secrets (WORKOS_API_KEY, WORKOS_ORG_ID, KANDJI_API_TOKEN) are synced by CI
# from the claude-day Doppler project, mapped from their AUDIT_HARNESS_*
# names — never put them here.
name = "cd26-workos-audit-proxy"
main = "src/index.ts"
compatibility_date = "2026-02-10"
workers_dev = false
account_id = "7e7fcec4d315661895440b439328033d"

[[d1_databases]]
binding = "DB"
database_name = "cd26-workos-audit-proxy-db"
database_id = "19133f64-d804-45be-9c50-c3d67db67f4b"
migrations_dir = "migrations"

[vars]
# Iru is WorkOS's Kandji MDM tenant. With this + the KANDJI_API_TOKEN secret,
# device_user is a read-through cache refreshed from Kandji (MDM mode).
KANDJI_API_BASE = "https://workos.api.kandji.io"

[observability]
enabled = true
