# WorkOS-internal deployment of this vendor-neutral proxy: the Worker behind
# https://cd26-workos-audit-proxy.workos.tools that ingests the WorkOS agent
# fleet's audit events. Deploys into the workos-tools-apps dispatch namespace
# (zone wildcard route -> workos-tools-dispatch -> ROUTES KV), so identity
# arrives via Cf-Access-Jwt-Assertion (mode 1 in src/device.ts).
#
# Deploy: npm run deploy:internal (or CI .github/workflows/proxy-deploy.yml).
# Secrets (WORKOS_API_KEY, WORKOS_ORG_ID, KANDJI_API_TOKEN) are synced by CI
# from the claude-day Doppler project, mapped from their AUDIT_HARNESS_*
# names — never put them here.
name = "cd26-workos-audit-proxy"
main = "src/index.ts"
compatibility_date = "2026-02-10"
workers_dev = false
account_id = "7e7fcec4d315661895440b439328033d"

[[d1_databases]]
binding = "DB"
database_name = "cd26-workos-audit-proxy-db"
database_id = "19133f64-d804-45be-9c50-c3d67db67f4b"
migrations_dir = "migrations"

[vars]
# Iru is WorkOS's Kandji MDM tenant. With this + the KANDJI_API_TOKEN secret,
# device_user is a read-through cache refreshed from Kandji (MDM mode).
KANDJI_API_BASE = "https://workos.api.kandji.io"
# ============================================================================
# ACCESS (Mode 1) — this deployment depends on it EXCLUSIVELY.
#
# Inside the workos-tools-apps dispatch namespace, request.cf.tlsClientAuth
# does not survive the dispatcher hop, so the Cf-Access-Jwt-Assertion header
# (Mode 1) is the ONLY working ingress. Mode 1 is opt-in: it is honored only
# when BOTH ACCESS_TEAM_DOMAIN and ACCESS_AUD are set. If either is missing
# the Worker fails closed and rejects 100% of real traffic — a total ingest
# outage for the fleet.
#
# ACCESS_AUD is deliberately NOT set here. CI deploys this config on every
# push, so a placeholder in [vars] would BE the outage; instead the value is
# delivered as a Worker secret by the proxy-deploy workflow's name-mapped
# Doppler sync (AUDIT_HARNESS_ACCESS_AUD -> ACCESS_AUD). Secrets persist
# across script uploads, so stage it once (Doppler claude-day/prd, or a direct
# API PUT) BEFORE the first deploy of this code and there is no gap.
#
# The value is the Application Audience (AUD) tag of the Access app in front
# of cd26-workos-audit-proxy.workos.tools/api/events: Zero Trust → Access →
# Applications → the app → Overview.
# ============================================================================
ACCESS_TEAM_DOMAIN = "workos-internal.cloudflareaccess.com"

[observability]
enabled = true
