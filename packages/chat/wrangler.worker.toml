# Vendor-neutral config for the OPTIONAL companion Worker (a Cloudflare Workflow
# carried over from the internal-app template). The console does not call it, it
# has no cron triggers, and self-hosters can skip `npm run deploy:worker`
# entirely — nothing in the chat app breaks without it. No account_id: wrangler
# uses your logged-in account. The WorkOS-internal deploy is
# wrangler.worker.internal.toml.
name = "workos-audit-chat-workflow"
main = "./workers/workflow.ts"
compatibility_date = "2025-12-30"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "workos-audit-chat-db"
# Same database as the console: paste the id from `npm run db:create` here too.
database_id = "00000000-0000-0000-0000-000000000000"

[[workflows]]
name = "workos-audit-chat-update-workflow"
binding = "UPDATE_WORKFLOW"
class_name = "UpdateWorkflow"

[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "workos-audit-chat-images"

# The workflow asks the AI Gateway named "internal-app-gateway" for a model, so
# on your own account it only runs after you create a gateway with that name (or
# edit workers/workflow.ts). One more reason to skip deploying it.
[ai]
binding = "AI"
remote = true

# The template's hourly fun-fact workflow is not used by the audit chat app;
# no cron triggers so the workflow only runs if started manually.
[triggers]
crons = []

[observability]
enabled = true
