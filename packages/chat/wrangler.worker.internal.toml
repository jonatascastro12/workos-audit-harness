# WorkOS-internal deployment of the companion workflow Worker (the template's
# fun-fact workflow, kept only because CI has always deployed it and the
# cd26-workos-audit-chat-update-workflow / R2 bucket resources already exist).
# Unlike the console this is a NORMAL Worker, not a dispatch-namespace script,
# which is why CI can still use `wrangler secret bulk` against it.
#
# Deploy: npm run deploy:worker:internal (or CI .github/workflows/chat-deploy.yml).
# Every value below is the effective config of today's live deploy.
name = "cd26-workos-audit-chat-workflow"
main = "./workers/workflow.ts"
compatibility_date = "2025-12-30"
compatibility_flags = ["nodejs_compat"]
account_id = "7e7fcec4d315661895440b439328033d"

[[d1_databases]]
binding = "DB"
database_name = "cd26-workos-audit-chat-db"
database_id = "bf601292-5ee6-435f-8f94-58608fb31dd4"

[[workflows]]
name = "cd26-workos-audit-chat-update-workflow"
binding = "UPDATE_WORKFLOW"
class_name = "UpdateWorkflow"

[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "cd26-workos-audit-chat-images"

[ai]
binding = "AI"
remote = true

# The template's hourly fun-fact workflow is not used by the audit chat app;
# no cron triggers so the workflow only runs if started manually.
[triggers]
crons = []

[observability]
enabled = true
