# WorkOS-internal deployment of this vendor-neutral console: the Worker behind
# https://cd26-workos-audit-chat.workos.tools that WorkOS admins use to
# investigate the agent fleet's audit trail. Deploys into the workos-tools-apps
# dispatch namespace (zone wildcard route -> workos-tools-dispatch -> ROUTES KV),
# which is why it needs neither workers_dev nor a route of its own — and why a
# copy of this config deployed to any other account would be unreachable.
#
# Deploy: npm run deploy:internal (or CI .github/workflows/chat-deploy.yml).
# Migrate: npm run db:migrate:internal.
# Secrets (AUDIT_CHAT_* / AUDIT_HARNESS_*) are synced by CI from the claude-day
# Doppler project — never put them here.
#
# Every value below is the effective config of today's live deploy; external
# adopters use wrangler.toml instead and should not need to read this file.
name = "cd26-workos-audit-chat"
main = "./workers/app.ts"
compatibility_date = "2026-02-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
account_id = "7e7fcec4d315661895440b439328033d"

[assets]
directory = "./build/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cd26-workos-audit-chat-db"
database_id = "bf601292-5ee6-435f-8f94-58608fb31dd4"
migrations_dir = "migrations"

# The audit ingestion proxy's database (same Cloudflare account). The /settings
# page reads/writes the proxy's runtime settings (app_state key "proxy_settings")
# and its device_user cache through this binding — no HTTP admin API on the proxy.
# Deliberately NO migrations_dir: packages/proxy owns this database's schema;
# this app only reads/writes rows. All access goes through
# app/lib/proxy-settings.server.ts. The binding is optional in the app (see
# wrangler.toml) but must stay bound HERE — /settings is how we pause ingest.
[[d1_databases]]
binding = "PROXY_DB"
database_name = "cd26-workos-audit-proxy-db"
database_id = "19133f64-d804-45be-9c50-c3d67db67f4b"

# Workers AI binding used for AI Gateway access (`env.AI.gateway(...)`); the
# internal-app-gateway (this app's default) holds the stored Anthropic/OpenAI
# provider keys.
[ai]
binding = "AI"
remote = true

[vars]
# Hostname shown in the UI and used for the AuthKit redirect URI default. Must
# match a redirect URI registered on the AuthKit client.
AUDIT_CHAT_PUBLIC_HOSTNAME = "cd26-workos-audit-chat.workos.tools"

[observability]
enabled = true
